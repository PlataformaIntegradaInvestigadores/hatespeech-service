services:
  hatespeech-service:
    build:
      context: .
      args:
        INSTALL_GPU: "false"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    ports:
      - "127.0.0.1:8008:8008"
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-mock}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://hatespeech:hatespeech@hatespeech-db:5432/hatespeech}
      DEBUG: ${DEBUG:-True}
    depends_on:
      hatespeech-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      default:
      centinela-net:
        aliases:
          - hatespeech-service

  hatespeech-db:
    image: postgres:16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - hatespeech_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-hatespeech}
      - POSTGRES_USER=${DB_USER:-hatespeech}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hatespeech}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hatespeech} -d ${DB_NAME:-hatespeech}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  hatespeech_postgres_data:

networks:
  centinela-net:
    external: true
