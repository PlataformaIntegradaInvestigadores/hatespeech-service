name: Add issue to org project

# Los demás repos de Centinela agregan cada issue al Project de la
# organización con secrets.ORG_PROJECT_TOKEN. Este repo privado no hereda
# los secretos de PlataformaIntegradaInvestigadores: si el token no está,
# el job termina bien y deja constancia, en lugar de fallar.

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar ORG_PROJECT_TOKEN
        id: gate
        env:
          ORG_PROJECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
        run: |
          if [ -n "$ORG_PROJECT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ORG_PROJECT_TOKEN no está configurado en este repo. El issue no se agrega al Project de la organización."
          fi

      - uses: actions/add-to-project@v1.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          project-url: https://github.com/orgs/PlataformaIntegradaInvestigadores/projects/1
          github-token: ${{ secrets.ORG_PROJECT_TOKEN }}
