name: "CD — hatespeech-service → Producción"

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Control de calidad ────────────────────────────────────────────────────
  quality:
    name: Control de calidad
    runs-on: ubuntu-latest
    env:
      MODEL_BACKEND: mock
      DATABASE_URL: "sqlite://"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: ruff check
        run: python -m ruff check .
      - name: black --check
        run: python -m black --check .
      - name: Ejecutar tests
        # pyproject.toml ya fija --cov=app, el informe XML y --cov-fail-under=90.
        run: python -m pytest --cov-report=term-missing --junitxml=report-prod.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-results-prod
          path: |
            report-prod.xml
            coverage.xml
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Build de la imagen sin CUDA
        run: docker build --build-arg INSTALL_GPU=false -t hatespeech-service:${{ github.sha }} .

  # ── Deploy producción ────────────────────────────────────────────────────
  # Igual que el staging de ci.yml: el job reproduce el CD de los otros
  # servicios (runner self-hosted `production`, checkout en
  # /opt/centinela/hatespeech-service, healthcheck y rollback) pero no se
  # encola si falta la infraestructura. Activarlo exige la variable de
  # repositorio CENTINELA_DEPLOY_ENABLED=true y un runner con esa etiqueta.
  # El .env y los pesos del modelo viven en el servidor, no en GitHub.
  deploy-production:
    name: Deploy a servidor producción
    runs-on: [self-hosted, production]
    needs: quality
    if: vars.CENTINELA_DEPLOY_ENABLED == 'true'
    steps:
      - name: Actualizar código
        run: |
          cd /opt/centinela/hatespeech-service
          git fetch origin main
          git reset --hard origin/main

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela/hatespeech-service
          docker compose up -d --build --remove-orphans

      - name: Health check con rollback automático
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:${HATESPEECH_PUBLISH_PORT:-8008}/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback al commit anterior"
            cd /opt/centinela/hatespeech-service && git reset --hard HEAD~1
            docker compose up -d --build --remove-orphans
            exit 1
          fi
          echo "Deploy exitoso — hatespeech-service en producción"
