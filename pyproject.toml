[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=90"
markers = [
    "integration: marks tests as integration tests (run with -m integration)",
]

[tool.coverage.run]
# El backend Qwen necesita torch + GPU; CI corre con MODEL_BACKEND=mock.
# Su lógica pura (palabras, top-k) vive en app/domain/xai.py y sí se cubre.
branch = true
source = ["app"]
omit = ["app/adapters/outbound/classifiers/qwen.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
